# Deactivated (not deleted) in favor of fast-build.yml's self-hosted Azure
# runner architecture - the push trigger is removed so this no longer runs
# automatically, but workflow_dispatch is kept as a manual fallback in case
# the self-hosted path is ever unavailable.
name: build-x64
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Resume compiling from this earlier run''s last saved build-artifact instead of starting build-1 from scratch. Only useful when a previous run died mid-build (e.g. a runner crash) - a normal same-run stage failure/timeout already resumes on its own. Find the run id in the failed run''s URL.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

# cancel-in-progress deliberately false: a routine push must QUEUE behind a
# multi-day build, not kill it (three 30h+ builds died to pushes this way).
# To supersede a doomed run, cancel it manually first.
concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      resume_run_id: ${{ inputs.resume_run_id || '' }}
