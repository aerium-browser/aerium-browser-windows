name: build-x64
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Resume compiling from this earlier run''s last saved build-artifact instead of starting build-1 from scratch. Only useful when a previous run died mid-build (e.g. a runner crash) - a normal same-run stage failure/timeout already resumes on its own. Find the run id in the failed run''s URL.'
        type: string
        required: false
        default: ''
  push:
    # Branches only. `tags: ['*']` used to be here, inherited from upstream,
    # where releases are cut by pushing a tag by hand and nothing publishes
    # automatically. Aerium's publish-release job creates a tag after every
    # successful build, so that trigger closed a loop: build -> publish
    # v<version>-b<n> -> tag push starts another build -> publish -b<n+1> ->
    # ... Each lap is a ~30-hour x64 build of a commit that was already
    # released. It fired for real on v151.0.7922.173-b94, which started a
    # rebuild two seconds after the release appeared (that run was cancelled).
    # The per-ref concurrency group below could not stop it either, since a
    # tag ref is its own group and never queued behind the master build.
    # Building from a tag on purpose is what workflow_dispatch is for.
    branches: [master]
    paths:
      - 'build.py'
      - 'package.py'
      - 'args.gn'
      - 'flags.windows.gn'
      - 'downloads.ini'
      - 'domain_substitution.list'
      - 'pruning.list'
      - 'patches/**'
      - 'brand/**'
      - 'devutils/**'
      - 'ungoogled-chromium'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read
  actions: read

# Only the newest commit builds. A push supersedes whatever is in flight,
# because a build already compiling older sources cannot produce the artifact
# anyone now wants - it would spend a day to ship a binary that is wrong the
# moment it lands.
#
# This was false because three 30h+ builds died to pushes. That history is the
# reason the `paths` filter above matters more than this flag does: what made
# those losses losses is that ANY push counted, including ones that changed
# nothing the build reads. A CHANGELOG or README push does not start a run
# here, so it cannot cancel one either, and superseding is only ever triggered
# by a commit that genuinely changes what would be compiled. Losing a build to
# one of those is not a loss - its output was already stale.
#
# auto-resume.yml already assumed this: its cancelled-run branch checks whether
# the cancelled run's sha is still master's head and exits 0 when it is not,
# so an auto-cancellation will not be resurrected as an interruption.
concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      resume_run_id: ${{ inputs.resume_run_id || '' }}
