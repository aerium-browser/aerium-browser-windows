name: Fast build (self-hosted Azure)

# On-demand self-hosted architecture: starts a dedicated Windows Azure VM,
# builds directly on its persistent disk, publishes a release, then
# deallocates the VM regardless of outcome. Builds in place at
# GITHUB_WORKSPACE - the C:\ungoogled-chromium-windows relocation in
# .github/actions/prepare exists only to work around ephemeral GitHub-hosted
# runners (fresh disk every stage); on a persistent VM it would nest the repo
# under itself on the second run, so it's not reused here.
#
# Retry logic mirrors .github/actions/stage/index.js: build.py --ci exits
# non-zero either for a real error (fails again within minutes on retry) or
# because it hit its own internal 3.5h ninja timeout (a "slow" non-zero exit)
# - in the latter case the tree is left in a valid state for ninja to resume
# incrementally, so we just loop. No artifact zip/download round-trip is
# needed here since the disk itself persists between runs.
#
# Setup required before this can run: see aerium-browser-linux's
# self-hosted-runner-setup.md guide (Azure OIDC app registration,
# least-privilege RBAC role, runner registration on the VM). Needs repo
# variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, AZURE_VM_NAME (the Windows VM this time).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'patches/**'
      - 'flags.windows.gn'
      - 'build.py'
      - 'package.py'
      - 'downloads.ini'
      - 'pruning.list'
      - 'domain_substitution.list'
      - '.github/workflows/fast-build.yml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: fast-build-windows
  cancel-in-progress: false

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az vm start --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM_NAME }}"

  build:
    needs: start-vm
    runs-on: [self-hosted, azure-windows-builder]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # This VM's disk persists across runs - default clean=true would
          # git-clean the untracked build tree away on every checkout.
          clean: false

      - name: Exclude build tree from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${env:GITHUB_WORKSPACE}" -ErrorAction Stop
          } catch {
            Write-Host "Defender exclusion failed (non-fatal): $_"
          }

      - name: Build (retries fast-fails, loops through the 3.5h ninja timeout)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install httplib2==0.22.0
          # D16as_v7 has 16 vCPUs; the old GitHub-hosted stages used -j 2
          # because they only had 2 vCPUs available.
          $maxFastFailAttempts = 3
          for ($attempt = 1; $attempt -le $maxFastFailAttempts; $attempt++) {
            $start = Get-Date
            python build.py --ci -j 12
            $retCode = $LASTEXITCODE
            $buildMinutes = (New-TimeSpan -Start $start -End (Get-Date)).TotalMinutes
            if ($retCode -eq 0 -or $buildMinutes -ge 60) {
              break
            }
            Write-Host "build.py failed after $($buildMinutes.ToString('F1')) minutes (exit $retCode) - attempt $attempt/$maxFastFailAttempts, retrying in place"
          }
          if ($retCode -ne 0 -and $buildMinutes -lt 60) {
            Write-Error "build.py failed after only $($buildMinutes.ToString('F1')) minutes (exit $retCode) on all $maxFastFailAttempts attempts - real error, not a stage timeout."
            exit 1
          }
          while ($retCode -ne 0) {
            Write-Host "Stage timed out at 3.5h; resuming (ninja continues incrementally)"
            $start = Get-Date
            python build.py --ci -j 12
            $retCode = $LASTEXITCODE
            $buildMinutes = (New-TimeSpan -Start $start -End (Get-Date)).TotalMinutes
            if ($retCode -ne 0 -and $buildMinutes -lt 60) {
              Write-Error "build.py failed after only $($buildMinutes.ToString('F1')) minutes (exit $retCode) - real error, not a stage timeout."
              exit 1
            }
          }
          Write-Host "build finished"

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          file="$(ls build/aerium_*_installer_x64.exe build/aerium_*_windows_x64.zip 2>/dev/null | head -n1)"
          version="$(basename "$file" | sed -E 's/^aerium_([0-9.]+)-.*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum $(ls aerium_*_installer_x64.exe aerium_*_windows_x64.zip 2>/dev/null) > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1, pinned commit hash
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aerium ${{ steps.meta.outputs.version }} (x64)
          fail_on_unmatched_files: true
          files: |
            build/aerium_*_installer_x64.exe
            build/aerium_*_windows_x64.zip
            build/SHA256SUMS.txt

  stop-vm:
    needs: [start-vm, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az vm deallocate --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM_NAME }}"
