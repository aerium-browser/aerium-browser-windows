name: publish-release
on:
  workflow_run:
    workflows:
      - build-x64
    types:
      - completed
  # A build that auto-resume dispatched finishes WITHOUT emitting any
  # workflow_run event - GitHub deliberately suppresses those for anything
  # triggered with GITHUB_TOKEN, which every auto-resume dispatch is. Run
  # 31993640908 built 151.0.7922.137 successfully on 2026-08-17 and
  # published nothing for exactly this reason, while the failed
  # push-triggered run before it did fire the event (and correctly skipped).
  # Until then no auto-resumed build had ever succeeded, so the gap was
  # invisible. Manual dispatch is the recovery path for any build whose
  # event never arrived.
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-x64 run ID whose artifacts should be published. Find it in the run URL.'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish-release:
    # Publish after every successful build-x64 run that came from our own
    # repo (push or manual dispatch), not just tag builds.
    #
    # The head_branch check is the second half of the loop fix in
    # build-x64.yml: a build that somehow ran off a tag must not mint another
    # release, or it tags again and the cycle restarts. build-x64 no longer
    # triggers on tags, so this should never be what stops it - it is here so
    # that re-adding a tag trigger cannot silently recreate the loop.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source build run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id="$INPUT_RUN_ID"
            read -r conclusion head_sha run_number < <(gh api "repos/$REPO/actions/runs/$run_id" \
              --jq '"\(.conclusion) \(.head_sha) \(.run_number)"')
            # A dispatch names the run explicitly, so the success check the
            # workflow_run path gets from its `if:` has to happen here
            # instead - publishing a failed build's partial artifacts would
            # ship a broken release under a real version tag.
            if [ "$conclusion" != "success" ]; then
              echo "Run $run_id concluded '$conclusion' - refusing to publish a build that did not succeed." >&2
              exit 1
            fi
          else
            run_id='${{ github.event.workflow_run.id }}'
            head_sha='${{ github.event.workflow_run.head_sha }}'
            run_number='${{ github.event.workflow_run.run_number }}'
          fi
          echo "Publishing from build-x64 run $run_id (#$run_number, $head_sha)"
          {
            echo "run_id=$run_id"
            echo "head_sha=$head_sha"
            echo "run_number=$run_number"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: chromium
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.src.outputs.run_id }}

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          # Package filenames look like:
          #   aerium_150.0.7871.124-1.3_installer_x64.exe
          #   aerium_150.0.7871.124-1.3_windows_x64.zip
          file="$(ls artifacts/aerium_*_installer_x64.exe artifacts/aerium_*_windows_x64.zip 2>/dev/null | head -n1)"
          if [ -z "$file" ]; then
            echo "No Aerium package found in artifacts" >&2
            ls -R artifacts || true
            exit 1
          fi
          version="$(basename "$file" | sed -E 's/^aerium_([0-9.]+)-.*/\1/')"
          run="${{ steps.src.outputs.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-b${run}" >> "$GITHUB_OUTPUT"
          echo "Resolved version $version, tag v${version}-b${run}"

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum $(ls aerium_*_installer_x64.exe aerium_*_windows_x64.zip 2>/dev/null) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # GITHUB_TOKEN's permissions are capped by the enterprise/org/repo
          # default, and a workflow's own `permissions:` block cannot raise
          # them past it - so `contents: write` above is a request, not a
          # guarantee. Runs 32048400682 and 32049844042 both reached this
          # step with the artifacts downloaded and the tag resolved, and both
          # got 403 "Resource not accessible by integration" creating the
          # release. A PAT in a secret is not subject to that cap. Falls back
          # to GITHUB_TOKEN when the secret is absent, so this is inert until
          # RELEASE_TOKEN actually exists.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Aerium ${{ steps.meta.outputs.version }} (x64)
          target_commitish: ${{ steps.src.outputs.head_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/aerium_*_installer_x64.exe
            artifacts/aerium_*_windows_x64.zip
            artifacts/SHA256SUMS.txt
