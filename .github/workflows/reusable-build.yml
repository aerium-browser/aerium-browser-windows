name: reusable-build
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: '3.12'
      x86:
        type: boolean
        required: false
        default: false
      arm:
        type: boolean
        required: false
        default: false
      resume_run_id:
        description: Resume from this earlier run's last saved build-artifact instead of starting build-1 fresh - the only way to recover a run that died mid-build, since same-run resume (build-2 onward) can't reach back into a different, already-completed/dead run.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build-1:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: false
          from_artifact: ${{ inputs.resume_run_id != '' }}
          resume_run_id: ${{ inputs.resume_run_id }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      deterministic: ${{ steps.stage.outputs.deterministic }}
  build-2:
    needs: build-1
    if: ${{ !cancelled() && needs.build-1.result != 'skipped'
            && needs.build-1.outputs.deterministic != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ inputs.python-version }}
      - name: Run Stage
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ join(needs.*.outputs.finished) }}
          from_artifact: true
          x86: ${{ inputs.x86 }}
          arm: ${{ inputs.arm }}
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      deterministic: ${{ steps.stage.outputs.deterministic }}
